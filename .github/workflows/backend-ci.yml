name: Backend CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v7

      # Configurar JDK 26 en la máquina de prueba
      - name: Configurar JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      
      # Verificar la versión de Java utilizada
      - name: Verificar versión de java
        run: java --version
      
      # Ejecutar pruebas unitarias para asegurar que los tests base pasan sin errores
      #- name: Compilar y ejecutar pruebas unitarias
      #  run: ./mvnw clean test
      #  working-directory: backend/acme-backend
      
      # Guardar los reportes como artefactos si algo llega a fallar.
      - name: Subir Informe de resultados de prueba
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: target/surefire-reports/